[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gg-core = { path = "crates/gg-core" }
gg-gpu = { path = "crates/gg-gpu" }
gg-renderer = { path = "crates/gg-renderer" }
gg-engine = { path = "crates/gg-engine" }

ash = "0.38.0"
ash-window = "0.13.0"
bytemuck = "1.25.2"
cc = "1.9.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = "0.37.0"
epaint = { version = "0.37.0", features = ["bytemuck"] }
glam = "0.34.1"
nu-ansi-term = "0.50.3"
png = "0.18.1"
raw-window-handle = { version = "0.6.2", features = ["std"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
winit = "0.30.13"

[workspace.lints.rust]
# A crate opts in to unsafe code with `#![allow(unsafe_code)]` and a stated reason.
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
