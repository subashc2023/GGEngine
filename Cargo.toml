[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gg-core = { path = "crates/gg-core" }
gg-gpu = { path = "crates/gg-gpu" }
gg-renderer = { path = "crates/gg-renderer" }
gg-engine = { path = "crates/gg-engine" }
gg-macros = { path = "crates/gg-macros" }

ash = "0.38.0"
ash-window = "0.13.0"
bytemuck = "1.25.2"
cc = "1.9.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = "0.37.0"
epaint = { version = "0.37.0", features = ["bytemuck"] }
# Gamepads. On Windows its default backend, Windows.Gaming.Input, delivers input only to a
# focused window of the process; on Linux it builds against libudev through pkg-config, so a
# build needs pkg-config and libudev's headers, and a run libudev1.
gilrs = "0.11.2"
# bytemuck, so that glam's types can be the fields of vertices and shader parameters. scalar-math
# and libm, so that its math gives the same bits on every platform, as the simulation needs:
# without SIMD, whose SSE2 and NEON paths add in different orders and fuse multiplications with
# additions only on ARM, and with libm's functions rather than the platform's C library's. Cargo
# merges features across a build, so drawing's math is scalar too.
glam = { version = "0.34.1", features = ["bytemuck", "scalar-math", "libm"] }
# The float functions std leaves to the platform, in Rust and so the same everywhere: musl's,
# ported. Its default `arch` feature puts only what IEEE makes exact, such as sqrt, on hardware.
libm = "0.2.16"
nu-ansi-term = "0.50.3"
png = "0.18.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
raw-window-handle = { version = "0.6.2", features = ["std"] }
# The job system's pool and `join`, with the thread that ticks as a thread of the pool: `join` from
# one keeps its job on the stack, where a call from outside the pool allocates through its queue.
# Not rayon's parallel iterators, whose splits and reductions follow the number of threads.
rayon-core = "1.13.0"
ron = "0.12.2"
scoped-tls = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# serde_derive's version, so that the two build once.
syn = "3.0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
# Tracy's client, for gg-core's zones. Its defaults open a profiler to the network and add
# sampling, system tracing and a crash handler; these keep its listener on loopback, where the
# broadcast lets a viewer on this machine list it.
tracy-client = { version = "0.19.0", default-features = false, features = [
    "enable",
    "only-localhost",
    "broadcast",
] }
# Pins Tracy 0.14.1, of which tracy-client takes a range: the viewer and its tools must be that
# release to read the captures. Its own defaults would come back through feature unification
# without `default-features = false`. At run time, `TRACY_NO_EXIT=1` has a run wait before it
# exits until a viewer or `tracy-capture` has taken everything, and `TRACY_NO_INVARIANT_CHECK=1`
# lets Tracy run on x86 VMs, whose clocks it otherwise refuses.
tracy-client-sys = { version = "=0.30.1", default-features = false }
# winit's version, so that the two build once.
windows-sys = "0.52.0"
winit = "0.30.13"

[workspace.lints.rust]
# A crate opts in to unsafe code with `#![allow(unsafe_code)]` and a stated reason.
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
