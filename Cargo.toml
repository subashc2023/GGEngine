[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gg-api = { path = "crates/gg-api" }
gg-core = { path = "crates/gg-core" }
gg-gpu = { path = "crates/gg-gpu" }
gg-renderer = { path = "crates/gg-renderer" }
gg-engine = { path = "crates/gg-engine" }
gg-macros = { path = "crates/gg-macros" }
gg-relay = { path = "crates/gg-relay" }
cook = { path = "tools/cook" }

ash = "0.38.0"
ash-window = "0.13.0"
# The OS's clipboard, which a game's text fields paste from and copy to, in every build: the one
# egui-winit's `clipboard` reaches it through, at its version. Without its default `image-data`,
# which pulls in the image crate, as games copy text alone; on Linux through X11, which Wayland's
# sessions serve through XWayland.
arboard = { version = "3.7.0", default-features = false }
# Decodes BC7 and BC5 on the CPU, as GPUs do, for the cooker's tests of what it compressed: bcdec's
# port, in safe Rust alone.
bcdec_rs = "0.2.1"
# MikkTSpace's tangents, as glTF asks for a model's normal map that comes without them: the
# reference's port, in safe Rust alone, without std, its square roots and arccosines the engine's.
bevy_mikktspace = { version = "1.0.0", default-features = false }
bytemuck = "1.25.2"
cc = "1.9.0"
# The cooker's compression of games' textures, into KTX2 supercompressed with zstd: bc7enc_rdo's
# encoder for BC7, perceptual for colors, and Intel's ISPC Texture Compressor for normal maps'
# BC5, as ISPC objects the crates ship built for each OS and architecture CI builds on, so that no
# ISPC compiler is needed. Runs read what it writes with ktx2 and zstd.
ctt = { version = "0.6.1", default-features = false, features = [
    "encoder-bc7enc",
    "encoder-intel",
    "ispc-prebuilt",
] }
egui = { version = "0.37.0", features = ["default_fonts"] }
# Without its default `links`, which opens a clicked link in the browser: no UI shows one.
egui-winit = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "wayland",
    "x11",
] }
epaint = { version = "0.37.0", features = ["bytemuck"] }
# Fonts' multi-channel signed distance fields, in Rust alone: msdfgen's method, its error
# correction among it, but not its handling of outlines that overlap themselves.
fdsm = "0.8.0"
# The OS's secure random numbers, for a relay's tickets and tokens, as std has no secure generator.
# snow's version, through which gg-engine draws a session's code.
getrandom = "0.3.4"
# Gamepads. On Windows its default backend, Windows.Gaming.Input, delivers input only to a
# focused window of the process; on Linux it builds against libudev through pkg-config, so a
# build needs pkg-config and libudev's headers, and a run libudev1.
gilrs = "0.11.2"
# bytemuck, so that glam's types can be the fields of vertices and shader parameters. scalar-math
# and libm, so that its math gives the same bits on every platform, as the simulation needs:
# without SIMD, whose SSE2 and NEON paths add in different orders and fuse multiplications with
# additions only on ARM, and with libm's functions rather than the platform's C library's. Cargo
# merges features across a build, so drawing's math is scalar too. Pinned, as ARCHITECTURE.md's
# Determinism says.
glam = { version = "=0.34.1", features = ["bytemuck", "scalar-math", "libm"] }
# 16-bit floats, which skies' texels are as a development run decodes them. ctt's version.
half = { version = "2.7.1", default-features = false }
# Shapes games' text. epaint's version, so that the two build once.
harfrust = "0.12.0"
# The images fdsm generates fonts' fields into, and its decoder of Radiance's `.hdr`, which skies
# are. fdsm's version, without its defaults, its other codecs.
image = { version = "0.25.10", default-features = false, features = ["hdr"] }
# Sounds and music, decoded by symphonia and mixed on cpal's audio thread, which allocates nothing as
# it plays.
# Without its defaults, which raise that thread to a real-time priority, through D-Bus on Linux: its
# decoders of WAV, Ogg Vorbis, FLAC and MP3 alone. On Linux cpal builds against ALSA through
# pkg-config, so a build needs ALSA's headers, and a run libasound2.
kira = { version = "0.12.6", default-features = false, features = [
    "cpal",
    "flac",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# Reads the KTX2 files a game's package holds its textures in, which ctt writes as the cooker cooks
# them.
ktx2 = "0.5.0"
# macOS's C functions that say how much memory the process holds, which gg-engine logs.
libc = "0.2.191"
# Finds RenderDoc's library in the process, for captures. ash's version, so that the two build
# once.
libloading = "0.8.9"
# The float functions std leaves to the platform, in Rust and so the same everywhere: musl's,
# ported. Its default `arch` feature puts only what IEEE makes exact, such as sqrt, on hardware.
# Pinned, as ARCHITECTURE.md's Determinism says.
libm = "=0.2.16"
# The cooker's meshes: their triangles ordered for the GPU's caches, and their levels of detail.
# meshoptimizer 1.3's C++, which needs a C++ compiler, as VMA and Luau do.
meshopt = "0.7.0"
# Luau, for games' scripts: its VM and compiler, built from luau0-src's C++, which needs a C++
# compiler, as VMA does. luau-vector4, so that a quaternion crosses into a script as a vector, by
# value. Without luau-jit, whose native code nothing checks for the same bits on every platform, and
# without send, as the VM stays on the ticks' thread. Luau's C++ fuses no multiplications into
# additions, as .cargo/config.toml has it built. Pinned, as ARCHITECTURE.md's Determinism says.
mlua = { version = "=0.12.2", features = ["luau", "luau-vector4"] }
# Pinned beneath mlua, as ARCHITECTURE.md's Determinism says, gg-engine naming them for that alone:
# mlua's bindings, whose build script builds Luau with the vector size and C stack its features
# give, and Luau's C++, 0.22.0 holding Luau 740. Without their defaults, so that naming them turns
# nothing on.
mlua-sys = { version = "=0.13.0", default-features = false }
luau0-src = { version = "=0.22.0", default-features = false }
nu-ansi-term = "0.50.3"
png = "0.18.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
# 2D and 3D physics. enhanced-determinism, so that a step gives the same bits on every platform: its
# own glam's scalar math and libm's functions, simba's libm, ordered maps in place of hashed ones,
# and zeros of one sign; its solver's SIMD stays four lanes wide, which keeps that, where eight
# wouldn't. Its glam is 0.33, not the engine's, so vectors and rotations cross between them as
# numbers. serde-serialize, so that snapshot files hold its bodies and contacts, which a restored
# world steps on from as the world saved would have. Its f64 builds, dimforge's, under the names the
# code uses, as the engine's translations are f64, so that a body 1,000 km from the origin moves as
# precisely as one at it; rapier3d-f64's defaults add block-solver, which rapier3d's don't, so its
# others are named, keeping the solver the f32 build had. Pinned, as ARCHITECTURE.md's
# Determinism says.
rapier2d = { package = "rapier2d-f64", version = "=0.36.1", features = ["enhanced-determinism", "serde-serialize"] }
rapier3d = { package = "rapier3d-f64", version = "=0.36.1", default-features = false, features = ["dim3", "f64", "std", "enhanced-determinism", "serde-serialize"] }
# Pinned beneath rapier, as ARCHITECTURE.md's Determinism says, gg-engine naming them for that
# alone: what its arithmetic goes through. parry's collision detection, in each dimension;
# nalgebra's vectors and glamx's, which are its glam's, named rapier-glam here, as the engine's glam
# has the name; simba's scalars, and its four lanes, wide's, on safe_arch's intrinsics. Without their
# defaults, so that naming them turns nothing on.
parry2d-f64 = { version = "=0.31.1", default-features = false }
parry3d-f64 = { version = "=0.31.1", default-features = false }
nalgebra = { version = "=0.35.0", default-features = false }
glamx = { version = "=0.3.1", default-features = false }
rapier-glam = { package = "glam", version = "=0.33.12", default-features = false }
simba = { version = "=0.10.2", default-features = false }
wide = { version = "=1.7.1", default-features = false }
safe_arch = { version = "=1.2.0", default-features = false }
raw-window-handle = { version = "0.6.2", features = ["std"] }
# The job system's pool and `join`, with the thread that ticks as a thread of the pool: `join` from
# one keeps its job on the stack, where a call from outside the pool allocates through its queue.
# Not rayon's parallel iterators, whose splits and reductions follow the number of threads.
rayon-core = "1.13.0"
# The OS's own file dialogs, for tools: Windows' common item dialog, macOS's open and save panels,
# and elsewhere the XDG desktop portal's, through D-Bus, whose library it loads as it runs, or
# zenity's without a portal. Its defaults, so that on Wayland the portal's dialog attaches to the
# window it's shown over.
rfd = "0.17.2"
# integer128, for the 128-bit fields of rapier's bodies and colliders that snapshots hold.
ron = { version = "0.12.2", features = ["integer128"] }
# The release winit's Linux dependencies have, so that the two build once.
rustix = "1.1.5"
scoped-tls = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
# Reads fonts' outlines and metrics for their fields. epaint's version, so that the two build once,
# and so that its fonts are the ones harfrust reads.
skrifa = "0.44.0"
# float_roundtrip, so that numbers parse to the float nearest them in every build: Cargo turns a
# crate's features on across a build, and without it here, a build where another crate asked for
# it would parse a model's transforms, which reach the world hash, to other bits than one where none
# did.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# The Noise Protocol Framework, whose handshake keys a session's links by its code, and whose
# ciphers seal what they carry. Without its defaults, whose `std` turns on ring, C and assembly:
# RustCrypto's X25519, ChaCha20-Poly1305 and BLAKE2s alone, and the OS's randomness through
# getrandom.
snow = { version = "0.10.0", default-features = false, features = [
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }
# Hot patching. The release of dx, Dioxus's tool, that builds the patches, which must be its own:
# `gg run` checks the machine's dx against it.
subsecond = "=0.7.2"
# Decodes sounds as they load, and music as it plays for kira's streams, as kira's own decoders do
# but for a fix to each, as gg-engine's audio module says. kira's version, without its defaults,
# with kira's formats.
symphonia = { version = "0.6.1", default-features = false, features = [
    "flac",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# serde_derive's version, so that the two build once.
syn = "3.0.9"
# Reads TOML, for gg, which holds a game's clippy.toml and rust-toolchain.toml against its engine's:
# cargo's own parser, without its defaults' writing.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }
# Without its default `attributes`, the `#[instrument]` macro, which nothing uses.
# release_max_level_debug, so that optimized builds, those that ship among them, compile trace
# events out; debug events stay in every build, as `gg run --release` runs development builds
# optimized, and agents read events such as `Sound started` from them.
tracing = { version = "0.1.44", default-features = false, features = [
    "std",
    "release_max_level_debug",
] }
tracing-subscriber = { version = "0.3.23", features = ["json"] }
# Tracy's client, for gg-core's zones. Its defaults open a profiler to the network and add
# sampling, system tracing and a crash handler; these keep its listener on loopback, where the
# broadcast lets a viewer on this machine list it.
tracy-client = { version = "0.19.0", default-features = false, features = [
    "enable",
    "only-localhost",
    "broadcast",
] }
# Pins Tracy 0.14.1, of which tracy-client takes a range: the viewer and its tools must be that
# release to read the captures. Its own defaults would come back through feature unification
# without `default-features = false`. At run time, `TRACY_NO_EXIT=1` has a run wait before it
# exits until a viewer or `tracy-capture` has taken everything, and `TRACY_NO_INVARIANT_CHECK=1`
# lets Tracy run on x86 VMs, whose clocks it otherwise refuses.
tracy-client-sys = { version = "=0.30.1", default-features = false }
# winit's version, so that the two build once.
windows-sys = "0.52.0"
winit = "0.30.13"
# Decompresses the levels of a game's package's textures, which the cooker supercompresses through
# ctt, whose version this is. Without its defaults, zstd's legacy formats and dictionary building,
# which runs need neither of.
zstd = { version = "0.14.3", default-features = false }
# JPEGs, as textures and models' images may be: a decoder in Rust alone, the image crate's.
zune-jpeg = "0.5.15"

[workspace.lints.rust]
# A crate or one of its modules opts in to unsafe code with a stated reason, as AGENTS.md says.
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# The profiles, `shipping` and the dependencies dev builds optimize, are in .cargo/config.toml.
