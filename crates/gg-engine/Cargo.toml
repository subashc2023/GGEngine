[package]
name = "gg-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arboard.workspace = true
bevy_mikktspace.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-winit = { workspace = true, optional = true }
fdsm.workspace = true
gilrs.workspace = true
gg-api = { workspace = true, optional = true }
gg-core.workspace = true
gg-macros.workspace = true
gg-relay.workspace = true
gg-renderer.workspace = true
half.workspace = true
harfrust.workspace = true
image.workspace = true
kira.workspace = true
ktx2.workspace = true
mlua.workspace = true
png.workspace = true
rapier2d.workspace = true
rapier3d.workspace = true
rayon-core.workspace = true
rfd = { workspace = true, optional = true }
ron.workspace = true
scoped-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
skrifa.workspace = true
snow.workspace = true
subsecond = { workspace = true, optional = true }
symphonia.workspace = true
tracing.workspace = true
winit.workspace = true
zstd.workspace = true
zune-jpeg.workspace = true
# Unused: named so that the root Cargo.toml's pins of the crates beneath mlua and rapier hold.
glamx.workspace = true
mlua-sys.workspace = true
nalgebra.workspace = true
parry2d-f64.workspace = true
parry3d-f64.workspace = true
rapier-glam.workspace = true
safe_arch.workspace = true
simba.workspace = true
wide.workspace = true

# Refuses C++ flags that would let Luau's scripts give other bits on one platform than on another.
[build-dependencies]
gg-api.workspace = true
# Unused: named so that the root Cargo.toml's pin of Luau's C++, which mlua-sys's build script
# builds, holds.
luau0-src.workspace = true

# Hot reload's tests wait for the warnings its thread logs.
[dev-dependencies]
tracing-subscriber.workspace = true

[features]
# The engine's zones for Tracy, through gg-core's profile module.
tracy = ["gg-core/tracy"]
# Development tooling, which development builds turn on and shipping builds never do: the tool API,
# hot reload of games' shaders, textures, models, fonts, prefabs, sounds and music and patches of
# their code, assets' ID files, the OS's file dialogs, for now, and the UI: egui's passes and its
# input, through egui-winit, the dock, the title bars the UI draws, and the Inspector's and the
# Performance panel's UI. A build without it keeps egui for its types alone, which `Ui`'s methods
# name.
dev = ["dep:gg-api", "dep:egui-winit", "dep:rfd", "dep:subsecond"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The process's memory, which the memory module reads through macOS's C functions, and Ctrl+C,
# whose signal the interrupt module takes on every Unix.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The Windows modules' tests make windows of their own, which need the process's module handle.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }

# The allocation tests have mains of their own, so that no other test's threads allocate as they
# count, and the job system's threads start once in their process, as in a run.
[[test]]
name = "ticks"
harness = false

[[test]]
name = "frames"
harness = false

[lints]
workspace = true
