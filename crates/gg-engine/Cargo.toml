[package]
name = "gg-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
egui.workspace = true
egui-winit.workspace = true
gg-core.workspace = true
gg-macros.workspace = true
gg-renderer.workspace = true
png.workspace = true
ron.workspace = true
scoped-tls.workspace = true
serde.workspace = true
tracing.workspace = true
winit.workspace = true

[features]
# The engine's zones for Tracy, through gg-core's profile module.
tracy = ["gg-core/tracy"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The window frame's tests make a window of their own, which needs the module's handle.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }

[lints]
workspace = true
