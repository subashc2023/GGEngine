[package]
name = "gg-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
egui.workspace = true
egui-winit.workspace = true
gilrs.workspace = true
gg-core.workspace = true
gg-macros.workspace = true
gg-renderer.workspace = true
png.workspace = true
rayon-core.workspace = true
ron.workspace = true
scoped-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
winit.workspace = true
zune-jpeg.workspace = true

[features]
# The engine's zones for Tracy, through gg-core's profile module.
tracy = ["gg-core/tracy"]
# Development tooling, which development builds turn on and shipping builds never do: hot reload of
# games' shaders, for now.
dev = []

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The window frame's tests make a window of their own, which needs the module's handle.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }

# The allocation test has a main of its own, so that no other test's threads allocate as it
# counts, and the job system's threads start once in its process, as in a run.
[[test]]
name = "ticks"
harness = false

[lints]
workspace = true
