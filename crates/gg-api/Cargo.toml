[package]
name = "gg-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Reads projects' manifests.
ron.workspace = true
serde.workspace = true
# raw_value, so that a client hands on a result's JSON as the game wrote it, its objects' keys in
# their order, rather than sorted as serde_json's own values sort them.
serde_json = { workspace = true, features = ["raw_value"] }

[lints]
workspace = true
