[package]
name = "gg-renderer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# derive, for the plain data that shaders read: vertices, parameters and the texture handles in
# them, and push constants.
bytemuck = { workspace = true, features = ["derive"] }
epaint.workspace = true
gg-core.workspace = true
gg-gpu.workspace = true
tracing.workspace = true

[dev-dependencies]
egui.workspace = true
# The tests' skies, of 16-bit floats.
half.workspace = true
png.workspace = true

# The GPU tests have a main of their own, like gg-gpu's: it sets the Vulkan loader's
# environment before any thread exists, then runs the tests one at a time in one process.
[[test]]
name = "gpu"
harness = false

[lints]
workspace = true
