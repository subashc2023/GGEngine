[package]
name = "gg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
libm.workspace = true
nu-ansi-term.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracy-client = { workspace = true, optional = true }
tracy-client-sys = { workspace = true, optional = true }

# A panic's frames, by the module each return address is in (src/log/frames.rs): Windows' calls, and
# glibc's and libSystem's on Linux and macOS.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Zones, plots and frame marks for Tracy (src/profile.rs), which compile to nothing without it.
tracy = ["dep:tracy-client", "dep:tracy-client-sys"]

# The logging test has a main of its own: logging and the panic hook are the process's, so it runs
# itself again for each filter it tries.
[[test]]
name = "logging"
harness = false

[lints]
workspace = true
