# What clippy refuses across the workspace.

# std's float methods that it marks "Unspecified precision": what they give varies by platform, by
# Rust's version and even from one call to the next, so the same simulation would give other bits on
# other machines. The workspace uses gg_core::math's instead, the same everywhere: libm's functions
# and its own conversions.
disallowed-methods = [
    { path = "f32::sin", reason = "its precision is the platform's: use gg_core::math::libm::sinf" },
    { path = "f32::cos", reason = "its precision is the platform's: use gg_core::math::libm::cosf" },
    { path = "f32::tan", reason = "its precision is the platform's: use gg_core::math::libm::tanf" },
    { path = "f32::sin_cos", reason = "its precision is the platform's: use gg_core::math::libm::sincosf" },
    { path = "f32::asin", reason = "its precision is the platform's: use gg_core::math::libm::asinf" },
    { path = "f32::acos", reason = "its precision is the platform's: use gg_core::math::libm::acosf" },
    { path = "f32::atan", reason = "its precision is the platform's: use gg_core::math::libm::atanf" },
    { path = "f32::atan2", reason = "its precision is the platform's: use gg_core::math::libm::atan2f" },
    { path = "f32::sinh", reason = "its precision is the platform's: use gg_core::math::libm::sinhf" },
    { path = "f32::cosh", reason = "its precision is the platform's: use gg_core::math::libm::coshf" },
    { path = "f32::tanh", reason = "its precision is the platform's: use gg_core::math::libm::tanhf" },
