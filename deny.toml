# The layering rules in ARCHITECTURE.md that Cargo can't check, as cargo-deny bans: each crate
# below may be a direct dependency only of the crates in its `wrappers`, dev-dependencies
# included, and optional ones, which `[graph]` turns on. Check with `cargo deny check bans`; CI
# runs it.

[graph]
# Every feature of the workspace's crates, so that optional dependencies, such as gg-core's
# Tracy client, are checked too.
all-features = true

[bans]
# Duplicate versions say nothing about layering.
multiple-versions = "allow"
deny = [
    # No skip-level edges: each layer is reached only from the one above it, and the derives only
    # through gg-engine's re-exports.
    { crate = "gg-gpu", wrappers = ["gg-renderer"], reason = "the engine reaches the GPU only through gg-renderer" },
    { crate = "gg-renderer", wrappers = ["gg-engine"], reason = "apps and games build on gg-engine" },
    { crate = "gg-macros", wrappers = ["gg-engine"], reason = "games derive through gg-engine's re-exports" },
    # Each library only through the crate that owns it.
    { crate = "ash", wrappers = ["gg-gpu", "ash-window"], reason = "gg-gpu owns Vulkan" },
    { crate = "ash-window", wrappers = ["gg-gpu"], reason = "gg-gpu owns Vulkan" },
    { crate = "winit", wrappers = ["gg-engine", "egui-winit"], reason = "gg-engine owns the window and input" },
    { crate = "egui-winit", wrappers = ["gg-engine"], reason = "gg-engine owns the window and input" },
    { crate = "rfd", wrappers = ["gg-engine"], reason = "gg-engine owns the window, which dialogs belong to" },
    { crate = "gilrs", wrappers = ["gg-engine"], reason = "gg-engine owns the window and input" },
    { crate = "gilrs-core", wrappers = ["gilrs"], reason = "gg-engine owns the window and input" },
    { crate = "rayon-core", wrappers = ["gg-engine"], reason = "gg-engine's jobs module is the way into the pool" },
    { crate = "rapier2d-f64", wrappers = ["gg-engine"], reason = "gg-engine's physics module is the way into rapier" },
    { crate = "rapier3d-f64", wrappers = ["gg-engine"], reason = "gg-engine's physics module is the way into rapier" },
    { crate = "fdsm", wrappers = ["gg-engine"], reason = "gg-engine's font module bakes fonts' fields" },
    { crate = "harfrust", wrappers = ["gg-engine", "epaint"], reason = "gg-engine's font module shapes games' text, and egui's its own" },
    { crate = "skrifa", wrappers = ["gg-engine", "epaint"], reason = "gg-engine's font module reads games' fonts, and egui its own" },
    { crate = "kira", wrappers = ["gg-engine"], reason = "gg-engine's audio module plays sounds" },
    { crate = "cpal", wrappers = ["kira"], reason = "gg-engine's audio module plays sounds, through kira" },
    { crate = "symphonia", wrappers = ["kira", "gg-engine"], reason = "gg-engine's audio module decodes sounds through kira, and music for kira's streams itself" },
    { crate = "subsecond", wrappers = ["gg-engine"], reason = "gg-engine calls the layers, which is where patches reach a game" },
    { crate = "mlua", wrappers = ["gg-engine"], reason = "gg-engine's script module runs Luau, alike on every platform" },
    { crate = "mlua-sys", wrappers = ["mlua"], reason = "gg-engine's script module runs Luau, through mlua" },
    { crate = "luau0-src", wrappers = ["mlua-sys"], reason = "gg-engine's script module runs Luau, through mlua" },
    { crate = "ctt", wrappers = ["cook"], reason = "the cooker compresses games' textures, which runs read compressed" },
    { crate = "bevy_mikktspace", wrappers = ["gg-engine"], reason = "gg-engine's glTF reader makes models' tangents, which the cooker reads through it" },
    { crate = "meshopt", wrappers = ["cook"], reason = "the cooker optimizes games' meshes, which runs draw as cooked" },
    { crate = "ktx2", wrappers = ["gg-engine", "ctt"], reason = "gg-engine's image module reads the KTX2 that ctt writes for the cooker" },
    { crate = "zstd", wrappers = ["gg-engine", "ctt"], reason = "gg-engine's image module decompresses the KTX2 that ctt supercompresses for the cooker, and its net module compresses a server's states" },
    { crate = "snow", wrappers = ["gg-engine"], reason = "gg-engine's net module keys and seals sessions' links" },
    { crate = "tracy-client", wrappers = ["gg-core"], reason = "gg-core's profile module is the way into Tracy" },
    { crate = "tracy-client-sys", wrappers = ["tracy-client", "gg-core"], reason = "gg-core's profile module is the way into Tracy" },
]
