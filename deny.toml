# The layering rules in ARCHITECTURE.md that Cargo can't check, as cargo-deny bans: each crate
# below may be a direct dependency only of the crates in its `wrappers`, dev-dependencies
# included, and optional ones, which `[graph]` turns on. Check with `cargo deny check bans`; CI
# runs it.

[graph]
# Every feature of the workspace's crates, so that optional dependencies, such as gg-core's
# Tracy client, are checked too.
all-features = true

[bans]
# Duplicate versions say nothing about layering.
multiple-versions = "allow"
deny = [
    # No skip-level edges: each layer is reached only from the one above it.
    { crate = "gg-gpu", wrappers = ["gg-renderer"], reason = "the engine reaches the GPU only through gg-renderer" },
    { crate = "gg-renderer", wrappers = ["gg-engine"], reason = "apps and games build on gg-engine" },
    { crate = "gg-macros", wrappers = ["gg-engine"], reason = "games derive through gg-engine's re-exports" },
    { crate = "ash", wrappers = ["gg-gpu", "ash-window"], reason = "gg-gpu owns Vulkan" },
    { crate = "ash-window", wrappers = ["gg-gpu"], reason = "gg-gpu owns Vulkan" },
    { crate = "winit", wrappers = ["gg-engine", "egui-winit"], reason = "gg-engine owns the window and input" },
    { crate = "egui-winit", wrappers = ["gg-engine"], reason = "gg-engine owns the window and input" },
    { crate = "rfd", wrappers = ["gg-engine"], reason = "gg-engine owns the window, which dialogs belong to" },
    { crate = "gilrs", wrappers = ["gg-engine"], reason = "gg-engine owns the window and input" },
    { crate = "gilrs-core", wrappers = ["gilrs"], reason = "gg-engine owns the window and input" },
    { crate = "rayon-core", wrappers = ["gg-engine"], reason = "gg-engine's jobs module is the way into the pool" },
    { crate = "rapier2d", wrappers = ["gg-engine"], reason = "gg-engine's physics module is the way into rapier" },
    { crate = "tracy-client", wrappers = ["gg-core"], reason = "gg-core's profile module is the way into Tracy" },
    { crate = "tracy-client-sys", wrappers = ["tracy-client", "gg-core"], reason = "gg-core's profile module is the way into Tracy" },
]
