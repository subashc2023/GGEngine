[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
publish.workspace = true

# GPU drivers apply per-game profiles by executable name, and one matches `sandbox.exe`: under it,
# presentation ignores vsync. Engine executables get a `gg-` prefix to stay clear of such matches.
[[bin]]
name = "gg-sandbox"
path = "src/main.rs"

[dependencies]
# A development build, which reloads its shaders as they change.
gg-engine = { workspace = true, features = ["dev"] }
tracing.workspace = true

[features]
# Zones for Tracy: `cargo run -p sandbox --release --features tracy`.
tracy = ["gg-engine/tracy"]

[lints]
workspace = true
