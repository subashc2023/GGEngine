[package]
name = "editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Prefixed like `gg-sandbox`, which says why.
[[bin]]
name = "gg-editor"
path = "src/main.rs"

[dependencies]
# The tool API's client, and the memory a game's view is shared through: the editor reaches a
# project's game as the tools do.
gg-api.workspace = true
# A development build, as tools are.
gg-engine = { workspace = true, features = ["dev"] }
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true
