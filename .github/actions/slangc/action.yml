name: Install slangc
description: >
  Installs slangc from Slang's release, checked against the release's digests, in
  `$RUNNER_TEMP/slang`, putting its `bin` on the PATH: ci.yml's and ship.yml's, so that both build
  with one slangc.

runs:
  using: composite
  steps:
    - name: Install slangc
      shell: bash
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=linux-x86_64-glibc-2.28
            digest=84ebd777968caceea26b21bfd014341078be6047be6c5a963a69f984f896cebd ;;
          Linux-ARM64) asset=linux-aarch64-glibc-2.28
            digest=9959d741713162efdbd863ff6d32400432b6e103eae3a9ee0afbdba6a00c6a9e ;;
          Windows-X64) asset=windows-x86_64
            digest=7b9bb838b105de0bb86390196ac5bcb02efc610c0542517204105cf87ec98399 ;;
          Windows-ARM64) asset=windows-aarch64
            digest=b5802a24e810b2b82e18cc796166692b4431431b66a65b108d111b668a920e7c ;;
          macOS-ARM64) asset=macos-aarch64
            digest=07fa8833fdbb343c3674c84fdd885910f495f3daaaa0c732b32980151e8b58c4 ;;
          *) echo "no Slang release is listed for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        archive="slang-$SLANG-$asset.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSLo "$archive" "https://github.com/shader-slang/slang/releases/download/v$SLANG/$archive"
        actual=$( (sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive") | cut -d' ' -f1)
        if [ "$actual" != "$digest" ]; then
          echo "$archive's digest is $actual, not $digest"
          exit 1
        fi
        mkdir slang
        tar -xzf "$archive" -C slang
        echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
      env:
        SLANG: "2026.20"
