name: CI

# Not for a change to the docs alone, but docs/LUAU.md, which a test checks against the code.
on:
  push:
    paths: ["**", "!**.md", "!docs/**", "docs/LUAU.md"]
  pull_request:
    paths: ["**", "!**.md", "!docs/**", "docs/LUAU.md"]

permissions:
  contents: read

# A newer push to a branch cancels the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: ${{ matrix.name }}
    # A pull request from a branch of this repository was already checked when it was pushed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # About twice a run that compiles every crate afresh: a job that hangs holds its billed runner
    # that long, rather than GitHub's 360 minutes. The job that ships the demo builds every crate a
    # second time, in the shipping profile, and links it whole.
    timeout-minutes: ${{ matrix.part == 'shipping' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosted runners have no GPU. On Linux x86-64 the GPU tests and the headless runs below
          # run on lavapipe, Mesa's CPU Vulkan driver, from Debian trixie: Mesa 25.0, the first
          # with Vulkan 1.4, and the validation layer 1.4.309. Elsewhere they're skipped: on ARM64
          # too, as lavapipe takes most of a job's minutes, and the ARM64 jobs' tests check the
          # simulations' hashes without it.
          - { name: Linux x86-64, runner: ubuntu-24.04, container: "debian:trixie" }
          # The steps that run on one runner alone, in two parts beside Linux x86-64's gates rather
          # than after them, each about as long as the gates: in one job they made the run's longest
          # by far. A part runs none of the gates, and caches its own dependencies, which it builds
          # with other features or in another profile.
          - { name: Linux x86-64 runs, runner: ubuntu-24.04, container: "debian:trixie", part: runs }
          - { name: Linux x86-64 shipping, runner: ubuntu-24.04, container: "debian:trixie", part: shipping }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, container: "debian:trixie", skip-gpu-tests: "1" }
          - { name: Windows x86-64, runner: windows-2025, skip-gpu-tests: "1" }
          - { name: Windows ARM64, runner: windows-11-arm, skip-gpu-tests: "1" }
          - { name: macOS ARM64, runner: macos-15, skip-gpu-tests: "1" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      GG_SKIP_GPU_TESTS: ${{ matrix.skip-gpu-tests }}
    steps:
      # The runner's tool cache, which the container mounts and no step here uses: Linux x86-64's
      # jobs need its room on the runner's disk, whose space left the log shows, as each builds every
      # crate, the gates' tests and the shipping job's second build, in the shipping profile, the most.
      - name: Make room on the runner's disk
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          rm -rf "${RUNNER_TOOL_CACHE:?}"/*
          df -h "$RUNNER_TEMP"
      # g++ builds gg-gpu's Vulkan Memory Allocator; gilrs, for gamepads, builds against libudev
      # through pkg-config, and cpal, for sound, against ALSA.
      - name: Install build tools, lavapipe and the validation layer
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl g++ gcc git libasound2-dev \
            libc6-dev libudev-dev libvulkan1 mesa-vulkan-drivers pkgconf vulkan-validationlayers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gg-renderer's build compiles its shaders with slangc, which the Vulkan SDK ships, and games'
      # shaders compile with it as they run: in the tests on every runner, and in the sandbox. CI
      # takes it from Slang's release instead, checked against the release's digests, through an
      # action of the repository's own, which ship.yml shares, so it comes after the checkout.
      - uses: ./.github/actions/slangc
      # Installs the release rust-toolchain.toml pins, and caches dependencies.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Clippy, among the gates below, already denies warnings.
          build-warnings: warn
          # Only main saves its caches, which branches and pull requests restore: a branch's own
          # would push main's out of the repository's 10 GB.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Beside the job's: each part of Linux x86-64 caches what it builds, apart from the gates'.
          cache-key: ${{ matrix.part }}
      # AGENTS.md's gates, kept by --locked to the versions Cargo.lock pins.
      - run: cargo fmt --all --check
        if: ${{ !matrix.part }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: ${{ !matrix.part }}
      # With Tracy's C++ client compiled in, as the `tracy` feature builds it.
      - run: cargo clippy --workspace --all-targets --locked --features sandbox/tracy -- -D warnings
        if: ${{ !matrix.part }}
      # The shipping configuration, the player and the games without `dev`, whose gg-engine leaves it
      # out: on one runner, as what `dev` leaves out is alike on every platform.
      - name: Check the shipping configuration
        if: matrix.part == 'shipping'
        run: cargo clippy -p player -p shards -p foxball -p showcase --no-default-features --all-targets --locked -- -D warnings
      # gg-engine without `dev`, its tests included, which the workspace's builds never compile: on
      # one runner too, apart from the player, as its tests' dev-dependencies would merge into it.
      - name: Check gg-engine without dev
        if: matrix.part == 'shipping'
        run: cargo clippy -p gg-engine --all-targets --locked -- -D warnings
      # Its unit tests without `dev`, which `cargo test --workspace` turns on for every crate.
      - name: Test gg-engine without dev
        if: matrix.part == 'shipping'
        run: cargo test -p gg-engine --lib --locked
      # The docs, private items' included, without a warning: on one runner too, as they're alike
      # on every platform but in code built for one alone.
      - name: Check the docs
        if: matrix.part == 'shipping'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items --locked
      - run: cargo test --workspace --locked
        if: ${{ !matrix.part }}
      # Whether the engine runs: rendering offscreen on lavapipe, under validation, it exits 0.
      - name: Run the sandbox headless
        if: matrix.part == 'runs'
        run: cargo run -p sandbox --locked -- --headless --frames 60
      # Its frame times, which agents read from the log, before the run below adds a log of its own.
      - name: Check that the run logged its frame times
        if: matrix.part == 'runs'
        run: grep -q '"code":"engine.perf"' target/debug/logs/sandbox-*.jsonl
      # A tick of the simulation each frame, so that a headless run runs as many ticks anywhere.
      - name: Check that the run ticked once a frame
        if: matrix.part == 'runs'
        run: grep -q '"ticks":60,' target/debug/logs/sandbox-*.jsonl
      # Each frame handed to the render thread renders, the last as the run ends.
      - name: Check that the run rendered once a frame
        if: matrix.part == 'runs'
        run: grep -q '"code":"engine.perf","frames":60,' target/debug/logs/sandbox-*.jsonl
      # A run recorded as it goes replays without a GPU to the hashes it recorded, exiting 0: the
      # flags' path, end to end, which the tests take from inside. Recorded on four threads, it
      # replays on the default and on one too, since a tick goes the same way on any number.
      - name: Record a headless run, and replay it
        if: matrix.part == 'runs'
        run: |
          cargo run -p sandbox --locked -- --headless --frames 60 --threads 4 --record target/run.recording
          cargo run -p sandbox --locked -- --replay target/run.recording
          cargo run -p sandbox --locked -- --replay target/run.recording --threads 1
      # The demo's two peers in lockstep on the loopback, each exiting 0: the joiner starts from the
      # host's world, and their worlds hash alike at every tick, as no `net.desync` in either log
      # says; the host plays on alone once the joiner has gone. Each session's runs here are given
      # a code of their own, which a host or a server not given one makes and prints.
      - name: Run the demo as two lockstep peers
        if: matrix.part == 'runs'
        run: |
          cargo build -p shards --locked
          target/debug/gg-shards --headless --frames 600 --host 127.0.0.1:7700 --code 0000-0000-0000-7700 &
          host=$!
          target/debug/gg-shards --headless --frames 300 --join 127.0.0.1:7700 --code 0000-0000-0000-7700
          wait $host
          grep -q '"message":"The joiner joined the lockstep session"' target/debug/logs/shards-*.jsonl
          ! grep -q '"code":"net.desync"' target/debug/logs/shards-*.jsonl
      # The demo's two peers under rollback, over a link that holds each packet 100 ms, and up to 20
      # more, and loses 5% of them: each exits 0, the joiner joins, the host rolls back as its first
      # commands come, and their worlds hash alike at every tick run on both peers' inputs.
      - name: Run the demo as two rollback peers over a slow link
        if: matrix.part == 'runs'
        run: |
          target/debug/gg-shards --headless --frames 600 --host 127.0.0.1:7701 --code 0000-0000-0000-7701 --rollback --link 100,20,5 &
          host=$!
          target/debug/gg-shards --headless --frames 300 --join 127.0.0.1:7701 --code 0000-0000-0000-7701 --rollback --link 100,20,5
          wait $host
          test "$(grep -h '"message":"The joiner joined the lockstep session"' target/debug/logs/shards-*.jsonl | wc -l)" = 2
          grep -q '"code":"net.rollback","rollbacks":[1-9]' target/debug/logs/shards-*.jsonl
          ! grep -q '"code":"net.desync"' target/debug/logs/shards-*.jsonl
      # The demo's server, without a GPU, and two clients, over links that hold each packet 100 ms,
      # and up to 20 more, and lose 5% of them: each client exits 0, having joined as a player of its
      # own and corrected its world toward the server's states, whose text reads as the server's
      # hash says; and the server, sent Ctrl+C once they've gone, ends cleanly, exiting 0.
      - name: Run the demo as a server and two clients over a slow link
        if: matrix.part == 'runs'
        run: |
          target/debug/gg-shards --serve 127.0.0.1:7702 --code 0000-0000-0000-7702 --link 100,20,5 &
          server=$!
          target/debug/gg-shards --headless --frames 300 --connect 127.0.0.1:7702 --code 0000-0000-0000-7702 --link 100,20,5 &
          client=$!
          target/debug/gg-shards --headless --frames 300 --connect 127.0.0.1:7702 --code 0000-0000-0000-7702 --link 100,20,5
          wait $client
          kill -INT $server
          wait $server
          test "$(grep -h '"message":"Joined the server"' target/debug/logs/shards-*.jsonl | wc -l)" = 2
          test "$(grep -h '"code":"net.corrected","corrections":[1-9]' target/debug/logs/shards-*.jsonl | wc -l)" = 2
          grep -q '"message":"Ending the run, as Ctrl+C asks"' target/debug/logs/shards-*.jsonl
          ! grep -q '"code":"net.desync"' target/debug/logs/shards-*.jsonl
      # The demo's peers across the internet, as far as a runner can have it: a lockstep host and
      # joiner, then a rollback pair, meeting through a relay, `gg-relay`, the host registered there
      # alone and the joiner given the relay and the code alone, each in real time over a link of
      # 75 ms each way, up to 30 more and 2% lost, for 640 ticks. Each joiner joins, the third and
      # fourth to in these steps, every link's packets go direct once each end sees that way work,
      # as no router stands between them here, their worlds hash alike, each logs what its link
      # carried and how its delay went, and the relay logs the pairs.
      - name: Run the demo's peers through a relay, over a slow link
        if: matrix.part == 'runs'
        run: |
          cargo build -p relay --locked
          target/debug/gg-relay --listen 127.0.0.1:7800 &
          relay=$!
          slow="--headless --size 320x180 --real-time --relay 127.0.0.1:7800 --link 75,30,2"
          target/debug/gg-shards $slow --frames 800 --host --code 0000-0000-0000-7800 &
          host=$!
          target/debug/gg-shards $slow --frames 640 --join --code 0000-0000-0000-7800
          wait $host
          target/debug/gg-shards $slow --frames 800 --host --code 0000-0000-0000-7802 --rollback &
          host=$!
          target/debug/gg-shards $slow --frames 640 --join --code 0000-0000-0000-7802 --rollback
          wait $host
          kill $relay
          wait $relay || true
          test "$(grep -h '"message":"The joiner joined the lockstep session"' target/debug/logs/shards-*.jsonl | wc -l)" = 4
          test "$(grep -h '"code":"net.direct"' target/debug/logs/shards-*.jsonl | wc -l)" = 4
          grep -q '"code":"net.traffic"' target/debug/logs/shards-*.jsonl
          grep -q '"code":"net.delay"' target/debug/logs/shards-*.jsonl
          grep -q '"code":"relay.paired"' target/debug/logs/relay-*.jsonl
          ! grep -q '"code":"net.desync"' target/debug/logs/shards-*.jsonl
      # Each tick, run again on a copy of the world taken as it started, with the commands it
      # applied, leaves the copy as it left the world, as rollback needs: the sandbox's and the
      # demo's headless, and the demo's live recording replayed, which steers, dashes, collects and
      # edits, each exiting 0 and saying so as it ends.
      - name: Run each tick again, as a SyncTest
        if: matrix.part == 'runs'
        run: |
          cargo run -p sandbox --locked -- --headless --frames 120 --sync-test
          target/debug/gg-shards --headless --frames 300 --sync-test
          target/debug/gg-shards --replay games/shards/tests/references/live.recording --sync-test
          grep -q '"code":"sync_test.matched","ticks":120,' target/debug/logs/sandbox-*.jsonl
          test "$(grep -h '"code":"sync_test.matched"' target/debug/logs/shards-*.jsonl | wc -l)" = 2
      # The 3D demo, as the steps above run Shards: two lockstep peers, two rollback peers over a
      # slow link, the host rolling back, and a server and two clients over one, each correcting
      # toward its states, each run exiting 0 and no `net.desync` in any log; and its ticks run again
      # as a SyncTest, headless and replaying its live recording, which walks, turns, kicks and edits.
      # Its runs render 320 by 180: lavapipe draws its arena's frames on the runner's two CPUs, at
      # 1280 by 720 in about 265 ms each, which made the step the job's longest.
      - name: Run the 3D demo networked, and as a SyncTest
        if: matrix.part == 'runs'
        run: |
          cargo build -p foxball --locked
          fox=target/debug/gg-foxball
          headless="$fox --headless --size 320x180"
          logs="target/debug/logs/foxball-*.jsonl"
          $headless --frames 600 --host 127.0.0.1:7710 --code 0000-0000-0000-7710 &
          host=$!
          $headless --frames 300 --join 127.0.0.1:7710 --code 0000-0000-0000-7710
          wait $host
          $headless --frames 600 --host 127.0.0.1:7711 --code 0000-0000-0000-7711 --rollback --link 100,20,5 &
          host=$!
          $headless --frames 300 --join 127.0.0.1:7711 --code 0000-0000-0000-7711 --rollback --link 100,20,5
          wait $host
          $fox --serve 127.0.0.1:7712 --code 0000-0000-0000-7712 --link 100,20,5 &
          server=$!
          $headless --frames 300 --connect 127.0.0.1:7712 --code 0000-0000-0000-7712 --link 100,20,5 &
          client=$!
          $headless --frames 300 --connect 127.0.0.1:7712 --code 0000-0000-0000-7712 --link 100,20,5
          wait $client
          kill -INT $server
          wait $server
          $headless --frames 300 --sync-test
          $fox --replay games/foxball/tests/references/live.recording --sync-test
          test "$(grep -h '"message":"The joiner joined the lockstep session"' $logs | wc -l)" = 2
          grep -q '"code":"net.rollback","rollbacks":[1-9]' $logs
          test "$(grep -h '"message":"Joined the server"' $logs | wc -l)" = 2
          test "$(grep -h '"code":"net.corrected","corrections":[1-9]' $logs | wc -l)" = 2
          test "$(grep -h '"code":"sync_test.matched"' $logs | wc -l)" = 2
          ! grep -q '"code":"net.desync"' $logs
      # The 3D demo's server registered at a relay alone, and two clients given the relay and the
      # code alone, over the slow link of the step above, the clients for 640 ticks: each joins as
      # a player of its own, the third and fourth to in these steps, each of the four links'
      # packets go direct, and each run logs what its links carried and the clients how they were
      # corrected; the server, sent Ctrl+C, ends cleanly.
      - name: Run the 3D demo's server and clients through a relay, over a slow link
        if: matrix.part == 'runs'
        run: |
          target/debug/gg-relay --listen 127.0.0.1:7801 &
          relay=$!
          fox=target/debug/gg-foxball
          session="--relay 127.0.0.1:7801 --code 0000-0000-0000-7801 --link 75,30,2"
          logs="target/debug/logs/foxball-*.jsonl"
          $fox --serve $session &
          server=$!
          $fox --headless --size 320x180 --frames 640 --connect $session &
          client=$!
          $fox --headless --size 320x180 --frames 640 --connect $session
          wait $client
          kill -INT $server
          wait $server
          kill $relay
          wait $relay || true
          test "$(grep -h '"message":"Joined the server"' $logs | wc -l)" = 4
          test "$(grep -h '"code":"net.direct"' $logs | wc -l)" = 4
          grep -q '"code":"net.traffic"' $logs
          grep -q '"code":"net.corrected"' $logs
          ! grep -q '"code":"net.desync"' $logs
      # Whether the editor runs, its view a panel that the UI draws among its own, exiting 0.
      - name: Run the editor headless
        if: matrix.part == 'runs'
        run: cargo run -p editor --locked -- --headless --frames 60
      # With Tracy's client, which records into memory with no viewer and exits as usual. Hosted
      # runners are VMs, whose clocks Tracy otherwise refuses on x86.
      - name: Run the sandbox headless with Tracy
        if: matrix.part == 'runs'
        run: cargo run -p sandbox --locked --features tracy -- --headless --frames 60
        env:
          TRACY_NO_INVARIANT_CHECK: "1"
      # The demo as it ships, as `gg ship` lays it out: built without `dev` in the shipping profile,
      # beside the package the cooker writes, it replays its live recording to every hash, exiting 0,
      # and runs headless, from a directory of its own, with neither its project nor slangc where its
      # build found them. Builds without `dev` log in the per-user state directory, here the job's
      # own.
      - name: Ship the demo, and run it as it ships
        if: matrix.part == 'shipping'
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state"
          cargo gg ship shards
          shipped="$RUNNER_TEMP/shipped"
          cp -R target/ship/shards "$shipped"
          cp games/shards/tests/references/live.recording "$shipped"
          mv games/shards "$RUNNER_TEMP/shards"
          mv "$RUNNER_TEMP/slang" "$RUNNER_TEMP/slang-away"
          "$shipped/gg-shards" --replay "$shipped/live.recording"
          "$shipped/gg-shards" --headless --frames 120
          mv "$RUNNER_TEMP/slang-away" "$RUNNER_TEMP/slang"
          mv "$RUNNER_TEMP/shards" games/shards
          grep -q "Running from the game's package" "$XDG_STATE_HOME"/ggengine/Shards/logs/shards-*.jsonl
      # The reference player as it ships, a build of it alone, without `dev`: with the showcase cooked
      # into its package beside it, in a directory of its own, it runs the showcase's scenes and Luau
      # scripts headless, with neither the showcase's project nor slangc where its build found them,
      # exiting 0, logs its load time and memory, and warns of nothing.
      - name: Run the player as it ships
        if: matrix.part == 'shipping'
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state"
          cargo build -p player --locked
          player="$RUNNER_TEMP/player"
          mkdir "$player"
          cp target/debug/gg-player "$player"
          cargo run -p cook --locked -- games/showcase "$player/gg-player.ggpk"
          mv games/showcase "$RUNNER_TEMP/showcase"
          mv "$RUNNER_TEMP/slang" "$RUNNER_TEMP/slang-away"
          "$player/gg-player" --headless --frames 120
          mv "$RUNNER_TEMP/slang-away" "$RUNNER_TEMP/slang"
          mv "$RUNNER_TEMP/showcase" games/showcase
          logs="$XDG_STATE_HOME/ggengine/Player/logs"
          grep -q "Running from the game's package" "$logs"/player-*.jsonl
          grep -q '"code":"engine.loaded"' "$logs"/player-*.jsonl
          # Last, as `set -e` ignores a command that `!` inverts, and the step ends with this one's.
          ! grep -qE '"level":"(WARN|ERROR)"' "$logs"/player-*.jsonl
      # `gg new`'s game builds against the engine as it is and runs headless, from the workspace and
      # from inside its project: nothing else compiles its template. Last, as the new member changes
      # the lock file, which `--locked` refuses.
      - name: Make a new game, and check it
        if: matrix.part == 'runs'
        run: cargo gg new probe && cargo gg check probe && (cd games/probe && cargo gg check)

  layering:
    name: Layering rules
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check bans
