[package]
name = "cook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Prefixed like `gg-sandbox`, which says why.
[[bin]]
name = "gg-cook"
path = "src/main.rs"

[dependencies]
# Compresses textures to BC7, in KTX2.
ctt.workspace = true
# Reads the project's manifest and its assets' ID files, and walks its asset root.
gg-api.workspace = true
# What the engine makes of a file as it loads it, so that the package holds the same.
gg-engine.workspace = true
# Optimizes meshes' triangles and builds their levels of detail.
meshopt.workspace = true
serde_json.workspace = true

# The tests' textures, and the BC7, BC5 and BC6H they compress to, decoded on the CPU, the last of
# 16-bit floats.
[dev-dependencies]
bcdec_rs.workspace = true
half.workspace = true
png.workspace = true

[lints]
workspace = true
