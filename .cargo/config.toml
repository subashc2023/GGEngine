[alias]
# `cargo gg <command>` builds and runs tools/gg, the command-line tool: `cargo gg help`.
gg = "run --quiet --package gg --"

# Luau's C++, which mlua builds through luau0-src and the cc crate, fusing no multiplication into an
# addition, so that scripts give the same bits on every platform: neither Luau nor luau0-src says,
# and GCC fuses by default, clang within an expression, wherever the CPU has fused instructions, as
# every ARM64 one does. gg-engine's build refuses flags without it, as gg-api's
# `build::check_cxx_contract` says. It's in `LUAU_CXXFLAGS`, the one variable whose change builds
# Luau again, for every target: MSVC, which takes no such flag, ignores it with a warning for each
# file, which cargo shows only with `-vv`. MSVC fuses none by default, as of Visual Studio 2022, but
# where Luau turns its precise math off around `%` and `//`, which on ARM64 it may: the reference
# hashes, which CI checks on Windows ARM64, would show it. A `LUAU_CXXFLAGS` set in the environment
# takes the place of this one.
[env]
LUAU_CXXFLAGS = "-ffp-contract=off"

# The workspace's profiles, here rather than in the root Cargo.toml so that this one file holds
# every setting a game's build takes from the engine: a game in a workspace of its own builds as
# the engine's games do with a copy of it, but for the alias. Cargo reads this file only for builds
# started in this directory or one below it, as `gg`, `dx` and the editor start theirs. Unlike the
# manifest's, a package named below that the workspace doesn't have, as one an update dropped,
# isn't warned of.

# Games' builds as they ship, as `gg ship` builds them, into `target/shipping`: release's, linked
# whole with fat LTO, a codegen unit to a crate. Panics still unwind, so that the render thread's
# resumes on the main thread. Debug info is line tables alone, with the symbols kept, so that a
# panic names its functions and the frames it logs turn into lines; `gg ship` keeps them beside the
# players' folder, not in it: the PDB on Windows, the executable before it's stripped on Linux, a
# dSYM on macOS.
[profile.shipping]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Debug builds decode a model's JPEGs as a layer adds it, the sandbox's 2,048 by 2,048 one in about
# 0.75 s unoptimized, at each of its tests' attaches and CI's runs.
[profile.dev.package.zune-jpeg]
opt-level = 3

# Debug builds bake a font's field as a layer adds it, Inter's in some 15 s unoptimized, at each of
# their tests' and runs' starts. nalgebra's and image's code that it runs is generic, and builds in
# fdsm, at fdsm's level; but fdsm's functions that fill a field are generic over its image, and build
# unoptimized in gg-engine, where Inter still takes about a second on one thread, as tests bake it,
# which a process takes once (gg-engine's font.rs).
[profile.dev.package.fdsm]
opt-level = 3

# Debug builds make a mesh collider's BVH in the step its body is made, at each Play's first tick
# in the editor: Sponza's in 1.37 s unoptimized, 0.11 s so. Floats step to the same bits at any
# level, so a world's hash doesn't change with it.
[profile.dev.package.parry3d-f64]
opt-level = 3

# Debug builds draw their development UI through egui each frame, and its text through the crates
# that shape, read and rasterize it, which unoptimized take some 6 times as long: the editor's
# panels some 6 ms a frame, where these make them 1 ms. Optimizing every dependency gained nothing
# more.
[profile.dev.package.egui]
opt-level = 3
[profile.dev.package.epaint]
opt-level = 3
[profile.dev.package.emath]
opt-level = 3
[profile.dev.package.ecolor]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.font-types]
opt-level = 3
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.dev.package.guillotiere]
opt-level = 3
[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.dev.package.unicode-general-category]
opt-level = 3
[profile.dev.package.unicode-properties]
opt-level = 3

# Debug builds' windowed frames allocate nothing on macOS without objc2's checks: each message's
# signature, parsed into vectors and checked against its class's. winit's objc2, 0.5, has no
# feature to turn them off.
[profile.dev.package.objc2]
debug-assertions = false
